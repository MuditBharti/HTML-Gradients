<!DOCTYPE html>
<html>
<head>
    <title> CSS Demo</title>
    <style>
        
        #linear{
            height: 50vh;
            width: 40vw;
            background-image: linear-gradient(180deg,red,orange 50%,yellow 60%,blue 70%);
        }
            #radial{
            height: 50vh;
            width: 60vw;
            background-image: radial-gradient(circle,black,purple,navy,blue,cyan,red);
        }
        #conic{
            height: 40vh;
            width: 40vw;
            background-image: conic-gradient(black,navy,blue,turquoise,seagreen,darkgreen,navy,darkblue,black);
        }
        
    </style>
</head> 
<body>
    <div id="linear"></div>
    <div id="radial"></div>\
    <div id="conic"></div>
</body>


</html>

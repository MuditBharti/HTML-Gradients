<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Festival</title>
    <style>
        body {
            background: conic-gradient(from 45deg at 50% 50%, #ff4d6d 0%, #ff9f1c 15%, #ffe66d 30%, #2ec4b6 45%, #4361ee 60%, #9b5de5 75%, #f15bb5 90%, #ff4d6d 100%);
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 6rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        p {
            font-size: 2rem;
            font-weight: normal;
            line-height: 1.8;
            margin: 10px 0;
        }

        .first-paragraph {
            color: #fff7ed;
        }

        .second-paragraph {
            color: #f8fafc;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff176;
            text-transform: capitalize;
            font-style: italic;
            margin-top: 20px;
       
        nav a.active, nav a:hover {
            background: white;
            color: #3b82f6;}

        
        }
        nav {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <nav>
        <a href="homework1.html">Linear Hero</a>
        <a href="homework2.html">Radial Creative</a>
        <a href="homeowork3.html" class="active">Conic Festival</a>
    </nav>

    <h1>Celebrate Colors</h1>
    <p class="first-paragraph">Every color tells a beautiful story.</p>
    <h2>Explore the World of Colors</h2>
    <p class="second-paragraph">Discover creativity, express yourself, and make every moment colorful.</p>
</body>
</html>

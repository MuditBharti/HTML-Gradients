<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Hero Section</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #0f2027 0%, #3b82f6 25%, #a855f7 50%, #f472b6 75%, #fbff24 100%);
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 8rem;
            color: white;
            margin-bottom: 10px;
        }

        p {
            font-size: 4rem;
            color: #fffacd; 
            margin-top: 0;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(to right, #f472b6 0%, #a855f7 50%, #fbff24 100%);
            color: white;
            font-size: 4rem;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
        }
        nav a.active, nav a:hover {
            background: white;
            color: #3b82f6;
        }
        nav {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <nav>
        <a href="homework1.html" class="active">Linear Hero</a>
        <a href="homework2.html">Radial Creative</a>
        <a href="homeowork3.html">Conic Festival</a>
    </nav>

    <h1>Build Your Future</h1>
    <p>Learn. Grow. Achieve.</p>
    <button>Get Started</button>
</body>
</html>
